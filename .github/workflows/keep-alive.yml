name: Keep Supabase Alive

# Ping Supabase mỗi 3 ngày để project free tier KHÔNG bị tự động pause
# (Supabase free tier tự pause sau ~7 ngày không có hoạt động)

on:
  schedule:
    - cron: '0 3 */3 * *'   # 3 giờ sáng UTC (~10h sáng VN), mỗi 3 ngày
  workflow_dispatch:         # cho phép bấm chạy tay để test ngay

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://rkdhrjydxbjtnnfdxieg.supabase.co/rest/v1/course_config?select=code&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
